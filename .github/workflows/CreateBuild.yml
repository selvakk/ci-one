name: Archive repository on push

on:
  push:

jobs:
  zip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create zip of repository contents
        run: |
          # Remove any previous archive if present
          rm -f repo-archive.zip
          # Create zip of all files in the workspace
          zip -r repo-archive.zip . -x ".git/*" "node_modules/*" ".github/*"
        working-directory: ${{ github.workspace }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-archive
          path: repo-archive.zip
